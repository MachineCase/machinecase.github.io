<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ── Base ─────────────────────────────────────────────────── */
body{background-color:#08060f!important;color:#c4b8d8!important}
#main-wrapper{background-color:#08060f}

/* ── Sidebar ──────────────────────────────────────────────── */
#sidebar{background:#050308!important;border-right:1px solid rgba(157,0,255,.15)!important;position:fixed!important}
#sidebar::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(157,0,255,.012) 2px,rgba(157,0,255,.012) 4px);z-index:0}

#sidebar .site-title{
  font-family:'Share Tech Mono',monospace!important;
  color:#9d00ff!important;
  font-size:1.45rem!important;
  letter-spacing:2px!important;
  text-shadow:0 0 12px rgba(157,0,255,.7),0 0 35px rgba(157,0,255,.3)!important;
  font-weight:400!important;
}
#sidebar .site-subtitle{color:#5a4878!important;font-size:.8rem!important;letter-spacing:.5px!important}
#sidebar a{color:#5a4878!important}
#sidebar ul li.nav-item a.nav-link{color:#7a6898!important}
#sidebar ul li.nav-item a.nav-link:hover{background-color:rgba(157,0,255,.08)!important;color:#b47fff!important}
#sidebar ul li.nav-item.active .nav-link{color:#9d00ff!important;background-color:rgba(157,0,255,.1)!important;text-shadow:0 0 8px rgba(157,0,255,.5)!important}
#sidebar #avatar{box-shadow:0 0 0 2px #9d00ff,0 0 18px rgba(157,0,255,.45)!important}
#sidebar .sidebar-bottom a:hover{color:#9d00ff!important}

/* ── Topbar ───────────────────────────────────────────────── */
#topbar-wrapper{background-color:rgba(8,6,15,.92)!important;border-bottom:1px solid rgba(157,0,255,.15)!important}

/* ── Typography ───────────────────────────────────────────── */
h1,h2,h3,h4,h5{color:#d4b8ff!important}
h1{text-shadow:0 0 14px rgba(157,0,255,.3)!important}
h2,h3{text-shadow:0 0 8px rgba(157,0,255,.18)!important}
a{color:#a855f7!important}
.content a:not(.img-link):hover{color:#9d00ff!important;border-bottom-color:#9d00ff!important;text-shadow:0 0 6px rgba(157,0,255,.4)!important}

/* ── Post cards ───────────────────────────────────────────── */
.post-preview{
  background:#0d0a16!important;
  border:1px solid rgba(157,0,255,.15)!important;
  box-shadow:none!important;
  border-radius:12px!important;
  transition:border-color .25s,box-shadow .25s!important;
}
.post-preview:hover{
  border-color:rgba(157,0,255,.55)!important;
  box-shadow:0 0 20px rgba(157,0,255,.12),0 0 0 1px rgba(157,0,255,.45)!important;
}
.card-title{color:#d4b8ff!important;font-weight:600!important}
.post-meta,.card-text{color:#5a4878!important}
#post-list .card{background:none!important;border:none!important}

/* ── Tags ─────────────────────────────────────────────────── */
.post-tag,.tag{
  background:rgba(157,0,255,.08)!important;
  border:1px solid rgba(157,0,255,.3)!important;
  color:#a855f7!important;
  border-radius:6px!important;
}
.post-tag:hover,.tag:hover{
  background:rgba(157,0,255,.18)!important;
  border-color:#9d00ff!important;
  color:#d4b8ff!important;
  text-shadow:0 0 6px rgba(157,0,255,.4)!important;
}

/* ── Code ─────────────────────────────────────────────────── */
code.highlighter-rouge{color:#c084fc!important;background:rgba(157,0,255,.07)!important;border:1px solid rgba(157,0,255,.2)!important}
.highlight,.highlight .w{color:#c4b8d8!important;background-color:#07050e!important}
div[class^=language-]{box-shadow:rgba(157,0,255,.2) 0 0 0 1px!important}
.highlight .k,.highlight .kn,.highlight .kp,.highlight .kr,.highlight .kv{color:#ff6ef7!important}
.highlight .kd,.highlight .kt,.highlight .kc{color:#f472b6!important}
.highlight .nf,.highlight .fm{color:#c084fc!important}
.highlight .s,.highlight .s1,.highlight .s2,.highlight .sb,.highlight .sc,.highlight .dl{color:#a3e635!important}
.highlight .c,.highlight .c1,.highlight .cm,.highlight .cs{color:#3d2d55!important}
.highlight .m,.highlight .mi,.highlight .mf,.highlight .mh{color:#67e8f9!important}
.highlight .na,.highlight .nc,.highlight .nn,.highlight .no{color:#fbbf24!important}

/* ── TOC & panel ──────────────────────────────────────────── */
#toc-wrapper ul .is-active-link{color:#9d00ff!important;text-shadow:0 0 6px rgba(157,0,255,.4)!important}
#panel-wrapper .panel-heading{color:#7a6898!important}
#access-lastmod a{color:#a855f7!important}

/* ── Footer ───────────────────────────────────────────────── */
footer{background-color:#08060f!important;border-top:1px solid rgba(157,0,255,.12)!important}
footer a{color:#7a6898!important}

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#08060f}
::-webkit-scrollbar-thumb{background:rgba(157,0,255,.35);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:rgba(157,0,255,.65)}

/* ── Blockquote ───────────────────────────────────────────── */
blockquote{border-left-color:rgba(157,0,255,.4)!important;color:#7a6898!important}

/* ── Panel breakpoint fix ─────────────────────────────────── */
@media (min-width:992px) and (max-width:1199px){
  #panel-wrapper{flex:0 0 auto;width:25%;display:block!important}
  main[aria-label="Main Content"]{flex:0 0 auto;width:75%}
}
</style>
